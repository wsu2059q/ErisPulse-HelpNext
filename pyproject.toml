[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ErisPulse-HelpNext"
version = "0.1.1"
description = "Modern help command module, session-aware listing & full i18n (requires ErisPulse 2.8.0+) | 现代化帮助命令模块，会话感知列表与完整多语言（需 ErisPulse 2.8.0+）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [ { name = "wsu2059q", email = "wsu2059@qq.com" } ]
keywords = [
    "ErisPulse",
    "HelpModule",
    "help",
    "Takumi",
    "i18n",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "ErisPulse-Takumi",
]

[project.urls]
"homepage" = "https://github.com/wsu2059q/ErisPulse-HelpNext"

[project.entry-points."erispulse.module"]
"HelpNext" = "HelpNext:Main"

[tool.hatch.build.targets.wheel]
packages = ["HelpNext"]
